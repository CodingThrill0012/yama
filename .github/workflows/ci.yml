name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Python 3.9 is not published for Ubuntu 26.04 (ubuntu-latest as of
    # this workflow). Keep 3.9 coverage on ubuntu-24.04.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: pytest
      - name: Doctor
        run: yama doctor
      - name: Three-worker example
        run: python examples/three_workers.py
