[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yama"
version = "0.1.0"
description = "Supervisor-owned authorization and process restraint for multi-agent systems."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Divyendu Bhatt" }]
keywords = [
    "authorization",
    "landlock",
    "seccomp",
    "multi-agent",
    "sandbox",
    "process-restraint",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
seccomp = ["pyseccomp"]

[project.scripts]
yama = "yama.cli:main"

[project.urls]
Homepage = "https://github.com/CodingThrill0012/yama"
Repository = "https://github.com/CodingThrill0012/yama"
Issues = "https://github.com/CodingThrill0012/yama/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "src"]
